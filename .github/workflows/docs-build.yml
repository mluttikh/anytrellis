# Build the documentation (docs/user/ -> site/), strict: a warning, an example that raises,
# a page over its weight or a public name in no guide fails it. The site is kept as the
# "github-pages" artifact; download it from the run and open index.html to read it.
#
# CI runs this on every push and pull request; a release deploys the site its CI built
# (release.yml), and docs.yml builds and deploys by hand. It deploys nothing itself: a
# workflow CI calls may not ask for more than CI's read-only token.
name: Build the docs

on:
  workflow_call:

permissions:
  contents: read

env:
  FORCE_COLOR: "1"
  UV_FROZEN: "1" # install exactly uv.lock

jobs:
  build:
    name: Build the documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Build the JavaScript bundle and install Chromium (for the gallery's pictures)
        working-directory: js
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
      - uses: astral-sh/setup-uv@v10.3.3 # publishes no moving major tag
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      - name: Build
        run: uv run python scripts/build_docs.py --gallery
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/
